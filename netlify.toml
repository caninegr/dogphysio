# Cache hashed build assets for 1 year (safe because filenames include hashes)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should be revalidated so new deploys show up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Optional: also ensure the root document isn't cached aggressively
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
