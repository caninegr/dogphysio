[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Cache immutable hashed build assets for 1 year
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# If your build outputs assets under /assets too (some setups do)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should revalidate so new deploys show up immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
